<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מערכת רכזים – מרפאות וביצועים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf2f3; --surface:#ffffff; --ink:#12303a; --ink2:#4d6670; --line:#d5e0e3;
  --primary:#17766f; --primary-ink:#ffffff; --soft:#dff0ee;
  --warn:#b97a00; --warn-bg:#fdf1d4; --bad:#b83a30; --bad-bg:#fbe3e0; --good:#1d7a45; --good-bg:#dff3e6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1a1f; --surface:#15272e; --ink:#e6f0f2; --ink2:#9db5bc; --line:#274047;
    --primary:#3bb5ab; --primary-ink:#06201d; --soft:#16393a;
    --warn:#f0b84a; --warn-bg:#3a2e12; --bad:#ff8a7e; --bad-bg:#40201c; --good:#6fd39a; --good-bg:#16372a;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:16px;line-height:1.45}
body{min-height:100vh;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header.top{background:var(--ink);color:#fff;padding:14px 0 16px}
:root[data-theme="dark"] header.top{background:#0a1418}
header.top .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between}
header.top h1{margin:0;font-size:1.1rem;font-weight:800}
header.top .sub{font-size:.8rem;opacity:.8}
.who select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px 10px;max-width:190px}
.who select option{color:#12303a}
.demo{background:var(--warn-bg);color:var(--warn);font-size:.8rem;padding:6px 14px;text-align:center}
main{padding-top:16px}
h2{font-size:1.15rem;margin:22px 0 10px;font-weight:800}
h3{font-size:1rem;margin:0 0 8px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.muted{color:var(--ink2);font-size:.85rem}
.kpi .n{font-size:1.7rem;font-weight:800;line-height:1.1}
.kpi .l{font-size:.8rem;color:var(--ink2)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.na{background:var(--line);color:var(--ink2)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)} .bar.good>i{background:var(--good)}
.hero{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:2rem;font-weight:800;line-height:1}
.ring .c span{font-size:.72rem;color:var(--ink2)}
.btn{background:var(--primary);color:var(--primary-ink);border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn.small{padding:6px 12px;min-height:36px;font-size:.88rem}
.btn.danger{background:var(--bad);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:.85rem;color:var(--ink2);margin:10px 0 4px}
.list .item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.list .item .t{font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink2);font-size:.8rem}
.scroll{overflow-x:auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav.tabs .in{max-width:760px;margin:0 auto;display:flex;gap:2px}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px;border-radius:10px;font-size:.74rem;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:1.25rem;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--primary);background:var(--soft);font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px;min-height:0;margin-top:2px;flex:none}
.empty{text-align:center;color:var(--ink2);padding:18px 6px}
.sector{margin:10px 0}
.sector .h{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:4px}
.back{background:none;border:0;color:var(--primary);font-weight:700;padding:6px 0;cursor:pointer}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:.9rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
@media (max-width:420px){.hero{flex-direction:column;align-items:flex-start}.grid3{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion: no-preference){.ring circle.v{transition:stroke-dashoffset .8s ease}}
.cb,.cbh{display:grid;grid-template-columns:78px 1fr 46px 74px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.cbh{font-size:.72rem;text-align:center}.cbh span:last-child,.cb .cs{text-align:left;direction:ltr}
.cb .cl{white-space:nowrap}.cb .cv{text-align:center}.cb .cs{color:var(--ink2);font-size:.78rem}
.tk{position:relative;height:16px}.tk .z{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--ink2)}
.tk .bb{position:absolute;top:2px;bottom:2px;border-radius:4px}.tk .bb.p{background:var(--good)}.tk .bb.n{background:var(--bad)}
.s1{display:flex;justify-content:space-between;gap:8px;margin-top:10px;white-space:nowrap;font-size:.9rem;color:var(--ink2)}.s1 b{font-size:1.05rem;color:var(--ink);font-weight:800}.s1 b.pos{color:var(--good)}.s1 b.neg{color:var(--bad)}
.dash .card{margin-bottom:12px;padding:12px}.dash h3{font-size:.95rem}.big{font-size:2.1rem;font-weight:800;line-height:1.1;margin:4px 0}.big.pos{color:var(--good)}.big.neg{color:var(--bad)}.s2{display:flex;flex-direction:column;gap:5px;margin-top:10px;font-size:.85rem;color:var(--ink2)}.s2 span{display:flex;justify-content:space-between;gap:6px}.s2 b{color:var(--ink);font-weight:800}.s2 b.pos{color:var(--good)}.s2 b.neg{color:var(--bad)}
.kv{display:flex;flex-direction:column;margin-bottom:8px;font-size:.88rem}.kv span{color:var(--ink2);font-size:.75rem}.kv b{font-weight:700;overflow-wrap:anywhere}
.row3{display:flex;gap:6px;margin-top:14px}.row3 .btn{flex:1;min-width:0;padding:10px 4px;font-size:.82rem;white-space:nowrap}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div><h1>מערכת הרכזים</h1><div class="sub" id="hdate"></div></div>
  <div class="who" id="who"></div>
</div></header>
<main class="wrap" id="app"></main>
<nav class="tabs" aria-label="ניווט ראשי"><div class="in" id="tabs"></div></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>

(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const TODAY=iso(new Date());
const fmtD=s=>{if(!s)return '—';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const sign=n=>(n>0?'+':'')+n;
const num=v=>(v===null||v===undefined||v===''||isNaN(Number(v)))?null:Math.round(Number(v));

/* ---------- חיבור ל-Supabase ---------- */
const SB_URL='https://afdiyssnlugstzrecxqq.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmZGl5c3NubHVnc3R6cmVjeHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTI0OTMsImV4cCI6MjEwODA4ODQ5M30.tJl5G5O-QF1ABdku94uEJL0RFYBt2irIxn80ExfepAY';
const MAIL_DOMAIN='@visitapp.example.com';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const CAPS=['מרץ 2025','מאי 2025','יולי 2025','ספט׳ 2025','נוב׳ 2025','ינו׳ 2026','מרץ 2026','מאי 2026','יולי 2026','ספט׳ 2026','נוב׳ 2026'];
const NC=CAPS.length;
const Y26=[5,6,7,8,9,10], Y25=[0,1,2,3,4];
const MGN={'חפר':'מנהלת חפר','שרון':'מנהלת שרון','שומרון':'מנהלת שומרון','בתי חולים':'בתי חולים'};
const ROLE_NAMES={admin:'מנהל – גישה מלאה',viewall:'צפייה בכל המינהלות',coord:'המינהלת שלו/ה בלבד',hosp:'בתי החולים שלה בלבד'};
const DEF_CHECK=['מעבר על יעד המצטרפים והביצוע בפועל','שיחה על מאזן המצטרפים והעוזבים','מעבר על סיבות העזיבה המובילות','מעבר על מקורות גיוס ותרומת עובדים','מעבר על יעד הלידים והטיפול בהם','קביעת תאריך למרתון גיוס','הגדרת משימות להמשך מול המרפאה'];
let CL=[],REASONS=[],USERS=[];
let db={visits:[],log:[],settings:{weights:{target:60,cover:25,visits:15},checklist:DEF_CHECK.slice()}};
function save(){}
const S={uid:null,tab:'home',clinicId:null,edit:false,visitClinic:null,showVisit:null,q:'',lim:40,f:{mg:'',sector:'',kind:'',sort:'bal'},vf:{clinic:'',coord:'',rc:'',status:'',period:''},rep:'summary',homeRc:'',editVisit:null,confirmDel:null,busy:false};
function me(){return USERS.find(u=>u.id===S.uid)||{id:null,name:'',title:'',role:'none',units:[]}}
function userName(id){const u=USERS.find(x=>x.id===id);return u?u.name:'—'}
function logChange(w){const u=me();sb.from('change_log').insert({user_id:u.id,user_name:u.name,what:w}).then(()=>{},()=>{})}
function errMsg(e){return (e&&e.message)?e.message:'שגיאה לא צפויה'}
function mapClinic(r){
  const j=(r.j||[]).slice(),l=(r.l||[]).slice();
  while(j.length<NC)j.push(null);while(l.length<NC)l.push(null);
  const rs={};Object.keys(r.rs||{}).forEach(k=>{rs[k]=r.rs[k]});
  return {id:r.id,mg:r.mg,name:r.name,code:r.code,town:r.town,addr:r.addr,sector:r.sector,kind:r.kind,target:r.target,dr:r.dr,adm:r.adm,nur:r.nur,ins:r.ins,hospital:r.hospital,pool:r.pool,j,l,rs,j0:j.slice(),l0:l.slice(),updated:r.updated,source:r.source};
}
function mapVisit(r){return {id:r.id,clinicId:r.clinic_id,coordId:r.coord_id,date:r.vdate,time:r.vtime,purpose:r.purpose,people:r.people,checks:r.checks||[],summary:r.summary,tasks:r.tasks||[],edited:r.edited}}
async function fetchAll(table,order){
  let out=[],from=0;
  for(;;){const q=sb.from(table).select('*').range(from,from+999);const {data,error}=order?await q.order(order):await q;if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000}
  return out;
}
async function loadVisits(){const rows=await fetchAll('visits','vdate');db.visits=rows.map(mapVisit).sort((a,b)=>b.date.localeCompare(a.date))}
async function loadAll(){
  const [pr,cl,rs,st]=await Promise.all([fetchAll('profiles'),fetchAll('clinics'),fetchAll('reasons','idx'),fetchAll('settings')]);
  USERS=pr.map(p=>({id:p.id,username:p.username,name:p.name,title:p.title,role:p.role,mg:p.mg,units:p.units||[]}));
  CL=cl.map(mapClinic);
  REASONS=[];rs.forEach(r=>{REASONS[r.idx]=r.name});
  st.forEach(r=>{if(r.key==='weights')db.settings.weights=r.value;if(r.key==='checklist')db.settings.checklist=r.value});
  await loadVisits();
}
async function loadLog(){const {data}=await sb.from('change_log').select('*').order('ts',{ascending:false}).limit(15);db.log=(data||[]).map(r=>({ts:new Date(r.ts).toLocaleString('he-IL'),user:r.user_name,what:r.what}))}

/* ---------- הרשאות ---------- */
function visibleClinics(){
  const u=me();
  return CL.filter(c=>u.role==='admin'||u.role==='viewall'||(u.role==='coord'&&c.mg===u.mg)||(u.role==='hosp'&&u.units.indexOf(c.id)>=0));
}
function getClinic(id){return visibleClinics().find(c=>c.id===id)||null}
function canEdit(c){const u=me();return u.role==='admin'||(u.role==='coord'&&c.mg===u.mg)||(u.role==='hosp'&&u.units.indexOf(c.id)>=0)}
function canEditTargets(){return me().role==='admin'}
function canExport(){const r=me().role;return r==='admin'||r==='viewall'}
function multiMg(){const r=me().role;return r==='admin'||r==='viewall'}
function visibleVisits(){const ids=new Set(visibleClinics().map(c=>c.id));return db.visits.filter(v=>ids.has(v.clinicId))}
function clinicName(id){const c=CL.find(x=>x.id===id);return c?c.name:'—'}

/* ---------- חישובים ---------- */
function m(c){
  let j=0,l=0,n=0;
  Y26.forEach(i=>{if(c.j[i]!==null&&c.l[i]!==null){j+=c.j[i];l+=c.l[i];n++}});
  const tg=c.target>0?c.target:null, yt=tg?tg*n:null, ya=tg?tg*6:null;
  return {j,l,bal:j-l,n,tg,yt,ya,pct:yt?j/yt*100:null};
}
const cap100=v=>v===null?null:Math.max(0,Math.min(100,Math.round(v)));
function lastVisit(id){let d=null;db.visits.forEach(v=>{if(v.clinicId===id&&(!d||v.date>d))d=v.date});return d}
function agg(list){
  let J=0,L=0,jt=0,tt=0,ta=0,nmax=0,rep=0;
  list.forEach(c=>{const x=m(c);J+=x.j;L+=x.l;if(x.n>nmax)nmax=x.n;if(x.n)rep++;if(x.yt){jt+=x.j;tt+=x.yt;ta+=x.ya}});
  const target=tt?jt/tt*100:null;
  const cover=(L>0)?Math.min(100,J/L*100):(J>0?100:null);
  const real=list.filter(c=>!c.pool);let vis=null;
  if(db.visits.length&&real.length){const lim=addDays(-20);vis=Math.round(real.filter(c=>{const d=lastVisit(c.id);return d&&d>=lim}).length/real.length*100)}
  const parts={target:cap100(target),cover:cap100(cover),visits:vis};
  const w=db.settings.weights;let sw=0,ss=0;
  Object.keys(parts).forEach(k=>{if(parts[k]!==null){sw+=w[k];ss+=w[k]*parts[k]}});
  return {J,L,bal:J-L,jt,tt,ta,nmax,rep,target,cover,vis,parts,total:sw?Math.round(ss/sw):null};
}
const PART_NAMES={target:'גיוס מצטרפים מול יעד',cover:'כיסוי עוזבים במצטרפים',visits:'ביקורים (20 הימים האחרונים)'};
function tone(p){return p===null||p===undefined?'na':p>=85?'good':p>=60?'warn':'bad'}
function bar(p){return '<div class="bar '+(p===null||p===undefined?'':tone(p))+'" role="progressbar" aria-valuenow="'+(p||0)+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+Math.min(100,p||0)+'%"></i></div>'}
function pctLabel(p,na){return p===null||p===undefined?(na||'לא דווח'):Math.round(p)+'%'}
function partDetail(k,a){
  if(k==='target')return a.tt?a.jt+' מצטרפים מתוך יעד של '+Math.round(a.tt)+' ('+a.nmax+' קפיטציות) · יעד שנתי '+Math.round(a.ta):'אין יעדים מוגדרים';
  if(k==='cover')return a.J+' מצטרפים מול '+a.L+' עוזבים';
  return a.vis===null?'עדיין לא תועדו ביקורים':'אחוז המרפאות שבוקרו ב־20 הימים האחרונים';
}
function partRow(k,a){
  const p=a.parts[k];
  return '<div class="sector"><div class="h"><span>'+PART_NAMES[k]+' <span class="muted">(משקל '+db.settings.weights[k]+'%)</span></span><b>'+pctLabel(p)+'</b></div>'+bar(p)+'<div class="muted">'+partDetail(k,a)+'</div></div>';
}
function capSeries(list){
  const out=[];
  for(let i=0;i<NC;i++){let j=0,l=0,any=false,jt=0,tt=0,r=0;
    list.forEach(c=>{if(c.j[i]!==null&&c.l[i]!==null){j+=c.j[i];l+=c.l[i];any=true;r++;if(c.target>0&&i>=5){jt+=c.j[i];tt+=c.target}}});
    out.push(any?{j,l,bal:j-l,r,jt,tt}:null);}
  return out;
}
function capBars(ser){
  const mx=Math.max(1,...ser.map(x=>x?Math.abs(x.bal):0));
  let h='<div class="cbh muted"><span></span><span>עוזבים ◂ מאזן ▸ מצטרפים</span><span></span><span>מצטרפים / עוזבים</span></div>';
  for(let i=ser.length-1;i>=5;i--){
    const x=ser[i];
    if(!x){h+='<div class="cb"><span class="cl">'+esc(CAPS[i])+'</span><div class="tk"><i class="z"></i></div><span class="cv muted">—</span><span class="cs muted">'+(i===ser.length-1?'טרם דווח':'לא דווח')+'</span></div>';continue}
    const w=Math.max(2,Math.round(Math.abs(x.bal)/mx*50));
    h+='<div class="cb"><span class="cl">'+esc(CAPS[i])+'</span><div class="tk"><i class="z"></i><i class="bb '+(x.bal>=0?'p':'n')+'" style="'+(x.bal>=0?'left':'right')+':50%;width:'+w+'%"></i></div><b class="cv '+(x.bal>0?'pos':x.bal<0?'neg':'')+'">'+sign(x.bal)+'</b><span class="cs">'+x.j+' / '+x.l+'</span></div>';
  }
  return '<div role="img" aria-label="מאזן לפי קפיטציה">'+h+'</div>';
}
function capTable(ser,list,a){
  const allT=list.reduce((t,c)=>t+(c.target>0?c.target:0),0);
  const cls=v=>v>0?'pos':v<0?'neg':'';
  let rows=ser.map((x,i)=>{const is26=i>=5;if(!is26)return '';
    return '<tr><td>'+esc(CAPS[i])+'</td><td>'+(is26?((x?x.tt:allT)||'—'):'—')+'</td><td>'+(x?x.j:'—')+'</td><td>'+(x?x.l:'—')+'</td><td class="'+(x?cls(x.bal):'')+'">'+(x?sign(x.bal):'—')+'</td></tr>'}).join('');
  if(a.rep)rows+='<tr><th>סה״כ 2026</th><th>'+(a.tt?Math.round(a.tt):'—')+'</th><th>'+a.J+'</th><th>'+a.L+'</th><th class="'+cls(a.bal)+'">'+sign(a.bal)+'</th></tr>';

function lab(i){const p=CAPS[i].split(' ');return [p[0],'’'+p[1].slice(2)]}
function chart(vals){
  const n=vals.length,W=n*30,H=150,mid=76;
  const mx=Math.max(1,...vals.map(v=>v===null?0:Math.abs(v)));
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="מאזן לפי קפיטציה" style="display:block">';
  s+='<line x1="0" x2="'+W+'" y1="'+mid+'" y2="'+mid+'" stroke="var(--line)"/>';
  vals.forEach((v,i)=>{
    const x=(n-1-i)*30+5,cx=x+10,L=lab(i);
    if(v===null){s+='<text x="'+cx+'" y="'+(mid-4)+'" font-size="9" fill="var(--ink2)" text-anchor="middle">—</text>'}
    else{const h=Math.max(1,Math.round(Math.abs(v)/mx*54)),y=v>=0?mid-h:mid;
      s+='<rect x="'+x+'" y="'+y+'" width="20" height="'+h+'" rx="3" fill="'+(v>=0?'var(--good)':'var(--bad)')+'"/>';
      s+='<text x="'+cx+'" y="'+(v>=0?y-3:y+h+10)+'" font-size="9" font-weight="700" fill="var(--ink)" text-anchor="middle">'+sign(v)+'</text>'}
    s+='<text x="'+cx+'" y="'+(H-17)+'" font-size="7.5" fill="var(--ink2)" text-anchor="middle">'+esc(L[0])+'</text><text x="'+cx+'" y="'+(H-7)+'" font-size="7.5" fill="var(--ink2)" text-anchor="middle">'+esc(L[1])+'</text>';
  });
  return s+'</svg>';
}
function openTasks(clinics){
  const ids=new Set(clinics.map(c=>c.id)),r=[];
  db.visits.forEach(v=>{if(!ids.has(v.clinicId))return;v.tasks.forEach((t,i)=>{if(!t.done)r.push({v,t,i})})});
  return r;
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;e.setAttribute('role','status');document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function reasonTotals(list,idx){
  const o={};
  list.forEach(c=>{Object.keys(c.rs).forEach(k=>{const a=c.rs[k];let s=0;idx.forEach(i=>{s+=a[i]||0});if(s)o[k]=(o[k]||0)+s})});
  return o;
}

  return '<div class="ring"><svg width="128" height="128" viewBox="0 0 128 128" aria-hidden="true"><circle cx="64" cy="64" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="12"/><circle class="v" cx="64" cy="64" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/></svg><div class="c"><b>'+(p===null?'—':p+'%')+'</b><span>ציון מתחילת השנה</span></div></div>';
}

function canVisit(){const r=me().role;return r==='coord'||r==='hosp'}
function coordOf(c){return USERS.find(u=>(u.role==='coord'&&u.mg===c.mg)||(u.role==='hosp'&&u.units.indexOf(c.id)>=0))||null}
function viewVisits(){
  if(S.visitClinic)return viewVisitForm(S.visitClinic);

  const cv=canVisit(),F=S.vf,lim20=addDays(-20),month=TODAY.slice(0,7);

  if(!cv&&F.rc)cl=cl.filter(c=>{const o=coordOf(c);return o&&o.id===F.rc});

  let vs=visibleVisits().filter(v=>ids.has(v.clinicId)).sort((a,b)=>b.date.localeCompare(a.date));
  if(F.clinic)vs=vs.filter(v=>v.clinicId===F.clinic);
  if(F.coord)vs=vs.filter(v=>v.coordId===F.coord);
  if(F.status==='open')vs=vs.filter(v=>v.tasks.some(t=>!t.done));
  if(F.period){const lim=addDays(-Number(F.period));vs=vs.filter(v=>v.date>=lim)}
  const stale=cl.filter(c=>{const d=lastVisit(c.id);return !d||d<lim20}).sort((a,b)=>{const pa=m(a).pct,pb=m(b).pct;return (pa===null?999:pa)-(pb===null?999:pb)});

    '<div class="card"><label for="f_rc" style="margin-top:0">סינון לפי רכז/ת</label><select id="f_rc" data-f="rc"><option value="">כל הרכזים</option>'+rowsU.map(r=>'<option value="'+r.u.id+'"'+(F.rc===r.u.id?' selected':'')+'>'+esc(r.u.name+' – '+r.u.title)+'</option>').join('')+'</select><div class="muted" style="margin-top:6px">הסינון חל על רשימת היחידות ללא ביקור ועל היסטוריית הביקורים.</div></div>';
  }
  return '<h2 style="margin-top:4px">ביקורים</h2>'+
  (cv?'<div class="card"><h3>דיווח ביקור חדש</h3><label for="v_pick">בחירת יחידה</label><select id="v_pick"><option value="">בחרו מרפאה</option>'+sorted.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select><button class="btn" data-act="newVisitPick" style="width:100%;margin-top:10px">פתיחת טופס ביקור</button></div>':dash)+
  (stale.length?'<div class="card"><h3>ללא ביקור מעל 20 יום ('+stale.length+')</h3><div class="muted">ממוינות לפי ביצוע נמוך מול היעד:</div><div class="chips">'+stale.slice(0,10).map(c=>'<span class="chip" data-act="openClinic" data-id="'+c.id+'" role="button" tabindex="0">'+esc(c.name)+'</span>').join('')+(stale.length>10?'<span class="muted">ועוד '+(stale.length-10)+'</span>':'')+'</div></div>':'')+

}
function viewReports(){

  }else if(R==='clinic'){

    body='<div class="card scroll"><table><thead><tr><th>מרפאה</th><th>מצטרפים</th><th>יעד יחסי</th><th>מול יעד</th><th>מאזן</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><span data-act="openClinic" data-id="'+r.c.id+'" role="button" tabindex="0" style="cursor:pointer;color:var(--primary);font-weight:700">'+esc(r.c.name)+'</span></td><td>'+(r.x.n?r.x.j:'—')+'</td><td>'+(r.x.yt?Math.round(r.x.yt):'—')+'</td><td><span class="pill '+tone(r.x.pct===null?null:r.x.pct)+'">'+pctLabel(r.x.pct,'אין יעד')+'</span></td><td class="'+(r.x.bal>=0?'pos':'neg')+'">'+(r.x.n?sign(r.x.bal):'—')+'</td></tr>').join('')+'</tbody></table></div>';
  }else if(R==='mg'){

  }else if(R==='sector'){
    body=groupRows([...new Set(cl.map(c=>c.sector||'לא מוגדר'))].map(g=>({n:g,cl:cl.filter(c=>(c.sector||'לא מוגדר')===g)})));
  }else{

/* ---------- סיכום ומשימות ---------- */
function buildSummary(cl){
  const a=agg(cl),tasks=openTasks(cl),ser=capSeries(cl);
  const li=ser.map((x,i)=>x?i:-1).filter(i=>i>=0).pop();
  const below=cl.filter(c=>!c.pool&&m(c).pct!==null&&m(c).pct<60).sort((x,y)=>m(x).pct-m(y).pct).slice(0,3);
  const r=reasonTotals(cl,[5,6,7,8,9]);const top=Object.keys(r).sort((x,y)=>r[y]-r[x]).slice(0,3);
  const L=['סיכום מצב – '+fmtD(TODAY)+' – '+me().name+' ('+scopeTitle()+')',''];
  L.push('1. ציון כולל: '+pctLabel(a.total,'אין נתונים'));
  L.push('2. 2026 עד כה ('+a.nmax+' קפיטציות): '+a.J+' מצטרפים, '+a.L+' עוזבים, מאזן '+sign(a.bal)+(a.target!==null?', ביצוע מול יעד '+Math.round(a.target)+'%':''));
  if(li!==undefined)L.push('3. קפיטציה אחרונה ('+CAPS[li]+'): '+ser[li].j+' מצטרפים, '+ser[li].l+' עוזבים, מאזן '+sign(ser[li].bal));
  L.push('4. מרפאות בפיגור: '+(below.length?below.map(c=>c.name+' ('+Math.round(m(c).pct)+'%)').join(', '):'אין'));
  L.push('5. סיבות עזיבה מובילות: '+(top.length?top.map(k=>REASONS[k]+' ('+r[k]+')').join(', '):'אין נתונים'));
  L.push('6. משימות: '+tasks.length+' פתוחות, מהן '+tasks.filter(x=>x.t.due&&x.t.due<TODAY).length+' באיחור');
  return L.join('\n');
}
function viewTasks(){
  const cl=visibleClinics(),tasks=openTasks(cl);
  return '<h2 style="margin-top:4px">סיכומים ומשימות</h2>'+
  '<div class="card"><h3>סיכום מצב</h3><pre id="sumTxt" style="white-space:pre-wrap;font-family:inherit;margin:0">'+esc(buildSummary(cl))+'</pre><div class="row" style="margin-top:12px"><button class="btn" data-act="copySummary">העתקת הסיכום</button></div><div class="muted" style="margin-top:8px">בגרסה אמיתית אפשר לשלוח את הסיכום אוטומטית בדוא״ל ובהתראה באפליקציה.</div></div>'+
  '<div class="card"><h3>משימות פתוחות</h3>'+(tasks.length?tasks.map(x=>'<div class="check"><input type="checkbox" data-act="toggleTask" data-v="'+x.v.id+'" data-i="'+x.i+'" aria-label="בוצע"'+(canVisit()?'':' disabled')+'><div><div>'+esc(x.t.text)+'</div><div class="muted">'+esc(clinicName(x.v.clinicId))+' · '+esc(x.t.owner||'')+' · יעד '+fmtD(x.t.due)+(x.t.due&&x.t.due<TODAY?' · <b class="neg">באיחור</b>':'')+'</div></div></div>').join(''):'<div class="empty">אין משימות פתוחות.</div>')+'</div>';
}

/* ---------- ניהול ---------- */
function viewAdmin(){
  if(me().role!=='admin')return '<div class="card empty">מסך זה זמין למנהל בלבד.</div>';
  const w=db.settings.weights,sum=w.target+w.cover+w.visits;
  return '<h2 style="margin-top:4px">ניהול מערכת</h2>'+
  '<div class="card"><h3>משקולות הציון</h3>'+Object.keys(PART_NAMES).map(k=>'<label for="w_'+k+'">'+PART_NAMES[k]+'</label><input type="number" id="w_'+k+'" value="'+w[k]+'" min="0" max="100">').join('')+
  '<div class="muted" style="margin-top:8px">סכום המשקולות: '+sum+'. כל רכיב מוגבל ל־100%, כדי שביצוע יתר לא יסתיר פיגור ברכיב אחר.</div><button class="btn" data-act="saveSettings" style="margin-top:10px">שמירה</button></div>'+
  '<div class="card"><h3>צ׳ק ליסט הביקור</h3>'+db.settings.checklist.map((t,i)=>'<div class="row" style="margin-bottom:8px"><input class="ck_in" data-i="'+i+'" value="'+esc(t)+'" aria-label="סעיף '+(i+1)+'"><button class="btn danger small" data-act="delCheck" data-i="'+i+'" aria-label="מחיקת סעיף">✕</button></div>').join('')+
  '<div class="row"><button class="btn ghost small" data-act="addCheck">הוספת סעיף</button><button class="btn small" data-act="saveCheck">שמירת צ׳ק ליסט</button></div></div>'+
  '<div class="card"><h3>משתמשים והרשאות</h3><div class="scroll"><table><thead><tr><th>שם</th><th>תפקיד</th><th>גישה</th></tr></thead><tbody>'+USERS.map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.title)+'</td><td>'+ROLE_NAMES[u.role]+(u.mg?' ('+esc(MGN[u.mg])+')':'')+(u.units&&u.units.length?' (בי״ח מאיר, בי״ח לוינשטיין)':'')+'</td></tr>').join('')+'</tbody></table></div></div>'+
  '<div class="card"><h3>יומן שינויים</h3>'+(db.log.length?db.log.slice(0,15).map(l=>'<div class="check"><div><div>'+esc(l.what)+'</div><div class="muted">'+esc(l.user)+' · '+esc(l.ts)+'</div></div></div>').join(''):'<div class="empty">אין שינויים עדיין.</div>')+'</div>'+
  '';
}

/* ---------- רינדור ---------- */
const TABS=[['home','🏠','בית'],['clinics','🏥','יחידות'],['visits','📝','ביקורים'],['reports','📊','ביצועים'],['tasks','✅','סיכום']];
function render(){
  const tabs=TABS.slice();if(me().role==='admin')tabs.push(['admin','⚙️','ניהול']);
  $('#tabs').innerHTML=tabs.map(([k,i,n])=>'<button data-act="tab" data-k="'+k+'"'+(S.tab===k?' aria-current="page"':'')+'><span class="ic" aria-hidden="true">'+i+'</span>'+n+'</button>').join('');
  $('#who').innerHTML='<button class="btn small" style="background:rgba(255,255,255,.15);color:#fff;min-height:36px" data-act="tab" data-k="account">'+esc(me().name)+' ▾</button>';
  $('#hdate').textContent=new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
  let h='';
  if(S.tab==='home')h=viewHome();
  else if(S.tab==='clinics')h=S.clinicId?viewClinic(S.clinicId):viewClinics();
  else if(S.tab==='visits')h=viewVisits();
  else if(S.tab==='reports')h=viewReports();
  else if(S.tab==='tasks')h=viewTasks();
  else if(S.tab==='admin')h=viewAdmin();
  else if(S.tab==='account')h=viewAccount();
  $('#app').innerHTML=h;
}
function go(tab,extra){S.tab=tab;S.clinicId=null;S.edit=false;S.visitClinic=null;S.showVisit=null;S.editVisit=null;S.confirmDel=null;Object.assign(S,extra||{});render();window.scrollTo(0,0);
  if(['home','visits','tasks','reports'].indexOf(tab)>=0)loadVisits().then(()=>{if(S.tab===tab&&!S.visitClinic&&!S.editVisit&&!S.edit)render()}).catch(()=>{});
  if(tab==='admin')loadLog().then(()=>{if(S.tab==='admin')render()}).catch(()=>{});
}

/* ---------- אירועים ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(el.tagName==='INPUT'&&a==='toggleTask')return;
  switch(a){
    case 'tab':go(el.dataset.k);break;
    case 'openClinic':go('clinics',{clinicId:id});break;
    case 'back':S.clinicId=null;S.edit=false;render();break;
    case 'more':S.lim+=40;render();break;
    case 'toggleEdit':S.edit=!S.edit;render();break;
    case 'newVisit':if(!canVisit())break;go('visits',{visitClinic:id});break;
    case 'newVisitPick':{if(!canVisit())break;const v=$('#v_pick').value;if(!v){toast('בחרו יחידה');break}go('visits',{visitClinic:v});break}
    case 'backVisits':if(S.editVisit){S.showVisit=S.editVisit;S.editVisit=null;S.visitClinic=null}else{S.visitClinic=null;S.showVisit=null}render();break;
    case 'showVisit':go('visits',{showVisit:id});break;
    case 'editVisit':{const v=db.visits.find(x=>x.id===el.dataset.v);if(v&&getClinic(v.clinicId)){S.editVisit=v.id;S.visitClinic=v.clinicId;S.showVisit=null;render();window.scrollTo(0,0)}break}
    case 'delVisit':if(canDeleteVisit()){S.confirmDel=el.dataset.v;render()}break;
    case 'delVisitNo':S.confirmDel=null;render();break;
    case 'delVisitYes':doDeleteVisit(el.dataset.v);break;
    case 'delTaskRow':{const r=el.closest('#taskRows > .card');if(r)r.remove();break}
    case 'addTaskRow':{const d=document.createElement('div');d.innerHTML=taskRow({});$('#taskRows').appendChild(d.firstChild);break}
    case 'saveVisit':saveVisit(id);break;
    case 'saveEdit':saveEdit(id);break;
    case 'rep':S.rep=el.dataset.k;render();break;
    case 'copyVisit':copyVisit(el.dataset.v);break;
    case 'copySummary':copyText($('#sumTxt').textContent);break;
    case 'exportCsv':exportCsv();break;
    case 'saveSettings':saveSettings();break;
    case 'addCheck':syncCheck();db.settings.checklist.push('סעיף חדש');render();break;
    case 'delCheck':syncCheck();db.settings.checklist.splice(Number(el.dataset.i),1);render();break;
    case 'saveCheck':saveChecklist();break;
    case 'login':doLogin();break;
    case 'logout':sb.auth.signOut();break;
    case 'changePw':changePw();break;



  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='lg_p'){doLogin();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click()}});
document.addEventListener('change',e=>{
  const t=e.target;

  if(t.dataset&&t.dataset.hrc){S.homeRc=t.value;render();return}
  if(t.dataset&&t.dataset.cf){S.f[t.dataset.cf]=t.value;S.lim=40;render();return}
  if(t.dataset&&t.dataset.f){S.vf[t.dataset.f]=t.value;render();return}
  if(t.matches&&t.matches('input[type=checkbox][data-act="toggleTask"]')){toggleTaskSrv(t.dataset.v,Number(t.dataset.i),t.checked);return}
  if(t.classList&&t.classList.contains('vchk')){$('#chkCount').textContent=document.querySelectorAll('.vchk:checked').length+' מתוך '+db.settings.checklist.length}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.lim=40;const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});

async function saveVisit(cid){
  const c=getClinic(cid);if(!c||S.busy)return;
  const ev=S.editVisit?db.visits.find(x=>x.id===S.editVisit):null;
  if(!ev&&!canVisit())return;
  const checks=db.settings.checklist.map((_,i)=>{const b=document.querySelector('.vchk[data-i="'+i+'"]');return b&&b.checked?1:0});
  const tasks=[...document.querySelectorAll('#taskRows > .card')].map(r=>({text:r.querySelector('.t_text').value.trim(),owner:r.querySelector('.t_owner').value.trim(),due:r.querySelector('.t_due').value,done:r.dataset.done==='1'})).filter(t=>t.text);
  const f={date:$('#v_date').value||TODAY,time:$('#v_time').value,purpose:$('#v_purpose').value.trim(),people:$('#v_people').value.trim(),checks,summary:$('#v_sum').value.trim(),tasks};
  const row={vdate:f.date,vtime:f.time,purpose:f.purpose,people:f.people,checks:f.checks,summary:f.summary,tasks:f.tasks};
  S.busy=true;
  try{
    if(ev){
      row.edited=TODAY;
      const {data,error}=await sb.from('visits').update(row).eq('id',ev.id).select();
      if(error)throw error;if(!data.length)throw new Error('אין הרשאה לעדכן את הביקור');
      Object.assign(ev,f,{edited:TODAY});logChange('עריכת ביקור ב'+c.name);S.editVisit=null;S.visitClinic=null;S.showVisit=ev.id;toast('הביקור עודכן');
    }else{
      const {data,error}=await sb.from('visits').insert(Object.assign({clinic_id:cid,coord_id:me().id},row)).select();
      if(error)throw error;
      const v=mapVisit(data[0]);db.visits.unshift(v);logChange('תיעוד ביקור ב'+c.name);S.visitClinic=null;S.showVisit=v.id;toast('הביקור נשמר');
    }
  }catch(e){S.busy=false;toast(errMsg(e));return}
  S.busy=false;render();window.scrollTo(0,0);
}
async function doDeleteVisit(id){
  const v=db.visits.find(x=>x.id===id);if(!v||!canDeleteVisit()||S.busy)return;
  S.busy=true;
  const {data,error}=await sb.from('visits').delete().eq('id',id).select();
  S.busy=false;
  if(error||!data.length){toast(error?errMsg(error):'אין הרשאה למחוק');return}
  db.visits=db.visits.filter(x=>x.id!==id);logChange('מחיקת ביקור ב'+clinicName(v.clinicId)+' מתאריך '+fmtD(v.date));
  S.showVisit=null;S.confirmDel=null;toast('הביקור נמחק');render();window.scrollTo(0,0);
}
async function toggleTaskSrv(vid,k,checked){
  const v=db.visits.find(x=>x.id===vid);
  if(!v||!getClinic(v.clinicId)||!canVisit()){render();return}
  const nt=v.tasks.map((t,i)=>i===k?Object.assign({},t,{done:checked}):t);
  const {data,error}=await sb.from('visits').update({tasks:nt}).eq('id',vid).select();
  if(error||!data.length){toast(error?errMsg(error):'אין הרשאה');render();return}
  logChange((checked?'סגירת':'פתיחת')+' משימה: '+nt[k].text);v.tasks=nt;render();
}
async function saveEdit(id){
  const c=getClinic(id);if(!c||!canEdit(c)||S.busy)return;
  const nj=c.j.slice(),nl=c.l.slice();
  for(let i=0;i<NC;i++){
    const a=$('#cj'+i),b=$('#cl'+i);
    if(a&&!a.disabled){const v=num(a.value);nj[i]=(v!==null&&v<0)?null:v}
    if(b&&!b.disabled){const v=num(b.value);nl[i]=(v!==null&&v<0)?null:v}
  }
  let nt=c.target;
  if(canEditTargets()&&$('#e_t')){const t=num($('#e_t').value);nt=t&&t>0?t:null}
  S.busy=true;
  const {error}=await sb.rpc('save_clinic_data',{p_id:c.id,p_j:nj,p_l:nl,p_target:nt});
  if(error){S.busy=false;toast(errMsg(error));return}
  const {data}=await sb.from('clinics').select('*').eq('id',c.id);
  S.busy=false;
  if(data&&data[0])Object.assign(c,mapClinic(data[0]));
  S.edit=false;toast('הנתונים נשמרו');render();
}
async function saveSettings(){
  if(me().role!=='admin')return;
  const w={};Object.keys(PART_NAMES).forEach(k=>{w[k]=Math.max(0,Number($('#w_'+k).value)||0)});
  const {error}=await sb.from('settings').upsert({key:'weights',value:w});
  if(error){toast(errMsg(error));return}
  db.settings.weights=w;logChange('עדכון משקולות הציון');toast('נשמר');render();
}
async function saveChecklist(){
  if(me().role!=='admin')return;
  syncCheck();
  const {error}=await sb.from('settings').upsert({key:'checklist',value:db.settings.checklist});
  if(error){toast(errMsg(error));return}
  logChange('עדכון צ׳ק ליסט הביקור');toast('נשמר');render();
}
function syncCheck(){document.querySelectorAll('.ck_in').forEach(i=>{db.settings.checklist[Number(i.dataset.i)]=i.value})}
function copyVisit(id){
  const v=db.visits.find(x=>x.id===id);if(!v)return;
  const L=['סיכום ביקור – '+clinicName(v.clinicId)+' – '+fmtD(v.date),'מתעד/ת: '+userName(v.coordId),'מטרה: '+(v.purpose||'—'),'','צ׳ק ליסט:'];
  db.settings.checklist.forEach((t,i)=>L.push((v.checks[i]?'✔ ':'✘ ')+t));
  L.push('','סיכום: '+(v.summary||'—'),'','משימות:');
  if(v.tasks.length)v.tasks.forEach(t=>L.push('- '+t.text+' ('+(t.owner||'')+', עד '+fmtD(t.due)+')'));else L.push('אין');
  copyText(L.join('\n'));
}
function copyText(t){
  const done=()=>toast('הועתק');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fb(t,done))}else fb(t,done);
}
function fb(t,cb){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');cb()}catch(e){toast('ההעתקה לא נתמכת בדפדפן')}a.remove()}
function exportCsv(){
  if(!canExport())return;
  const head=['מינהלת','מרפאה','ישוב','מגזר','מבוטחים','יעד לקפיטציה','יעד שנתי','מצטרפים 2026','עוזבים 2026','מאזן 2026','אחוז מהיעד'].concat(CAPS.map(x=>'מאזן '+x));
  const rows=[head];
  visibleClinics().forEach(c=>{const x=m(c);rows.push([MGN[c.mg],c.name,c.town||'',c.sector||'',c.ins==null?'':c.ins,c.target>0?c.target:'',c.target>0?c.target*6:'',x.n?x.j:'',x.n?x.l:'',x.n?x.bal:'',x.pct===null?'':Math.round(x.pct)].concat(CAPS.map((_,i)=>c.j[i]!==null&&c.l[i]!==null?c.j[i]-c.l[i]:'')))});
  copyText('\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'));
  logChange('ייצוא נתונים');
}

/* ---------- כניסה וחשבון ---------- */
function viewLogin(msg){
  return '<div class="card" style="max-width:380px;margin:30px auto"><h2 style="margin-top:0">כניסה למערכת</h2><label for="lg_u">שם משתמש</label><input id="lg_u" autocomplete="username" autocapitalize="none" dir="ltr"><label for="lg_p">סיסמה</label><input id="lg_p" type="password" autocomplete="current-password" dir="ltr">'+(msg?'<div class="neg" style="margin-top:10px" role="alert">'+esc(msg)+'</div>':'')+'<button class="btn" style="width:100%;margin-top:14px" data-act="login">כניסה</button></div>';
}
function showLogin(msg){$('#tabs').innerHTML='';$('#who').innerHTML='';$('#app').innerHTML=viewLogin(msg)}
async function doLogin(){
  if(S.busy)return;
  const u=($('#lg_u').value||'').trim().toLowerCase(),p=$('#lg_p').value||'';
  if(!u||!p){showLogin('יש להזין שם משתמש וסיסמה');return}
  S.busy=true;
  const {data,error}=await sb.auth.signInWithPassword({email:u+MAIL_DOMAIN,password:p});
  S.busy=false;
  if(error||!data||!data.user){showLogin('שם המשתמש או הסיסמה שגויים');return}
  S.uid=data.user.id;await start();
}
async function start(){
  $('#app').innerHTML='<div class="empty">טוען נתונים…</div>';
  try{await loadAll()}catch(e){showLogin('שגיאה בטעינת הנתונים: '+errMsg(e));return}
  if(me().role==='none'){await sb.auth.signOut();showLogin('למשתמש הזה אין הרשאות במערכת');return}
  S.tab='home';S.clinicId=null;S.lim=40;S.f={mg:'',sector:'',kind:'',sort:'bal'};S.vf={clinic:'',coord:'',rc:'',status:'',period:''};S.rep='summary';S.homeRc='';
  render();
}
function viewAccount(){
  const u=me();
  return '<h2 style="margin-top:4px">החשבון שלי</h2><div class="card"><div style="font-weight:800">'+esc(u.name)+'</div><div class="muted">'+esc(u.title)+' · '+ROLE_NAMES[u.role]+(u.mg?' ('+esc(MGN[u.mg])+')':'')+'</div><div class="muted">שם משתמש: '+esc(u.username)+'</div></div>'+
  '<div class="card"><h3>החלפת סיסמה</h3><label for="pw1">סיסמה חדשה (לפחות 8 תווים)</label><input id="pw1" type="password" autocomplete="new-password" dir="ltr"><label for="pw2">אימות סיסמה</label><input id="pw2" type="password" autocomplete="new-password" dir="ltr"><button class="btn" style="margin-top:12px" data-act="changePw">שמירת סיסמה</button></div>'+
  '<div class="card"><button class="btn ghost" data-act="logout">יציאה מהמערכת</button></div>';
}
async function changePw(){
  const a=$('#pw1').value||'',b=$('#pw2').value||'';
  if(a.length<8){toast('הסיסמה חייבת להכיל לפחות 8 תווים');return}
  if(a!==b){toast('הסיסמאות לא זהות');return}
  const {error}=await sb.auth.updateUser({password:a});
  if(error){toast(errMsg(error));return}
  toast('הסיסמה הוחלפה');$('#pw1').value='';$('#pw2').value='';
}
window.__app={setUser:id=>{S.uid=id},go,S,render,start,loadAll};
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){S.uid=null;USERS=[];CL=[];db.visits=[];showLogin()}});
(async function(){const {data}=await sb.auth.getSession();if(data&&data.session){S.uid=data.session.user.id;await start()}else showLogin()})();
})();


</script>
