<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מערכת רכזים – מרפאות וביצועים</title>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* משתני עיצוב: עיצוב "בנטו מדבקות" (בהיר, מסגרות עבות, צללים מלאים). שינוי צבע כאן משנה את כל האפליקציה */
:root{
  --bg:#eef1f8; --surface:#ffffff; --ink:#151515; --ink2:#454b63; --line:#cbd0e4;
  /* צבעי המדבקות */
  --yellow:#ffd84d; --pink:#ff9ec4; --sky:#8cd3ff; --mint:#8ef0c0; --orange:#ffa45b; --grey:#e4e7f2;
  /* תפקידים: משמשים בכל הקומפוננטות */
  --primary:#151515; --primary-ink:#ffffff; --soft:#fff3b8;
  --good:#0b6b3a; --good-bg:#8ef0c0; --warn:#7a4a00; --warn-bg:#ffd84d; --bad:#b3162b; --bad-bg:#ff9ec4;
  --focus:#1d4ed8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* בסיס: איפוס, טיפוגרפיה, כפתורים, שדות טופס, כותרת עליונה וסרגל ניווט תחתון צף */
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik','Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:16px;line-height:1.45}
body{min-height:100vh;padding-bottom:120px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
main{padding-top:14px}
h2,h3{font-family:'Secular One','Rubik',sans-serif;font-weight:400}
h2{font-size:1.5rem;margin:18px 0 10px;line-height:1.15}
h3{font-size:1.15rem;margin:0 0 8px}

/* כותרת עליונה */
header.top{padding:20px 0 4px}
header.top .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between}
header.top h1{margin:0;font-family:'Secular One','Rubik',sans-serif;font-weight:400;font-size:1.9rem;line-height:1.05}
header.top .sub{display:inline-block;margin-top:6px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:1px 10px;font-size:.78rem;font-weight:600;transform:rotate(-2deg)}

/* כפתורים */
.btn{background:var(--yellow);color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:#fff}
.btn.small{padding:5px 12px;min-height:38px;font-size:.88rem;box-shadow:2px 2px 0 var(--ink)}
.btn.danger{background:var(--pink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* שדות טופס */
input,select,textarea{width:100%;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;min-height:48px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:.85rem;font-weight:600;color:var(--ink2);margin:10px 0 4px}

/* סרגל ניווט תחתון צף */
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));z-index:20;pointer-events:none}
nav.tabs .in{pointer-events:auto;max-width:980px;margin:0 auto;display:flex;gap:4px;background:#fff;border:2.5px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);padding:7px}
nav.tabs button{flex:1;background:none;border:2px solid transparent;padding:6px 2px;border-radius:14px;font-size:.74rem;font-weight:700;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px}
nav.tabs button[aria-current="page"]{background:var(--yellow);border-color:var(--ink)}

.back{background:none;border:0;color:var(--ink);font-weight:700;padding:6px 0;min-height:44px;cursor:pointer;text-decoration:underline}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;z-index:30;font-size:.9rem}
/* קומפוננטות משותפות: כרטיסים ומדבקות כותרת, תגיות, טבלאות, רשימות, צ'יפים, שורות סטטיסטיקה */
.card{position:relative;background:var(--surface);border:2.5px solid var(--ink);border-radius:22px;padding:16px;margin-bottom:18px;box-shadow:4px 4px 0 var(--ink)}
/* צבעי כרטיס */
.tone-pink{background:var(--pink)} .tone-sky{background:var(--sky)} .tone-mint{background:var(--mint)}
.tone-orange{background:var(--orange)} .tone-yellow{background:var(--yellow)}
.tone-orange .muted{color:#2b2b2b}
/* כותרת "מדבקה" שמודבקת על שפת הכרטיס */
.has-sticker{margin-top:30px;padding-top:24px}
.sticker-title{position:absolute;top:-17px;right:16px;background:var(--yellow);border:2.5px solid var(--ink);border-radius:12px;padding:3px 14px;font-family:'Secular One','Rubik',sans-serif;font-size:1.05rem;transform:rotate(-2deg)}
.tone-mint .sticker-title,.tone-orange .sticker-title{background:#fff;transform:rotate(2deg)}
.card-subtitle{font-weight:700;line-height:1.35;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.muted{color:var(--ink2);font-size:.85rem}
.pos{color:var(--good)} .neg{color:var(--bad)}
/* על רקעים צבעוניים הטקסט תמיד כהה, כדי לשמור על ניגודיות */
.tone-pink .pos,.tone-pink .neg,.tone-mint .pos,.tone-mint .neg,.tone-sky .pos,.tone-sky .neg,.tone-orange .pos,.tone-orange .neg{color:var(--ink)}
/* תגיות */
.pill{display:inline-block;border:2px solid var(--ink);border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700;color:var(--ink);background:var(--grey)}
.pill.good{background:var(--mint)} .pill.warn{background:var(--yellow)} .pill.bad{background:var(--pink)} .pill.info{background:var(--sky)} .pill.na{background:var(--grey)}
/* רשימות: כל שורה היא כרטיסון עם מסגרת */
.list .item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:8px;background:#fff;border:2px solid var(--ink);border-radius:16px;cursor:pointer}
.list .item:last-child{margin-bottom:0}
.list .item .t{font-weight:700}
/* טבלאות */
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:9px 4px;text-align:right;border-top:1.5px solid var(--ink)}
thead th{border-top:0;font-weight:600;color:var(--ink2);font-size:.8rem}
.scroll{overflow-x:auto}
.bal-chip{display:inline-block;min-width:44px;text-align:center;direction:ltr;unicode-bidi:isolate;border:2px solid var(--ink);border-radius:99px;padding:1px 6px;font-size:.82rem;font-weight:700;color:var(--ink);background:#fff}
.bal-chip.pos{background:var(--mint)} .bal-chip.neg{background:var(--pink)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check input{width:24px;height:24px;min-height:0;margin-top:2px;flex:none}
.empty{text-align:center;color:var(--ink2);padding:18px 6px}
/* צ'יפים */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:2.5px solid var(--ink);background:#fff;border-radius:99px;padding:6px 14px;font-size:.85rem;font-weight:600;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}
/* שורות נתונים קצרות */
.s1{display:flex;justify-content:space-between;gap:8px;margin-top:10px;white-space:nowrap;font-size:.9rem;color:var(--ink2)}.s1 b{font-size:1.05rem;color:var(--ink);font-weight:800}.s1 b.pos{color:var(--good)}.s1 b.neg{color:var(--bad)}
.row3{display:flex;gap:8px;margin-top:14px}.row3 .btn{flex:1;min-width:0;padding:10px 4px;font-size:.82rem;white-space:nowrap}
/* מספרים ואחוזים מוצגים משמאל לימין, כדי שסימן מינוס ומפרידים יופיעו בצד הנכון בתוך טקסט עברי */
.num{direction:ltr;unicode-bidi:isolate}
.big.num,.s1 b.num,.s2 b.num{display:inline-block}
.s2 span b.num{text-align:left}
td:first-child{white-space:nowrap}
/* סגנונות ייעודיים למסכים: דשבורד הבית ודף מרפאה, תגית גודל, מעקב לידים */
.dash{gap:14px}
.dash .card{margin-bottom:14px;padding:14px}
.dash h3{font-size:1rem}
.big{font-family:'Secular One','Rubik',sans-serif;font-size:2.6rem;font-weight:400;line-height:1.05;margin:4px 0}
.big.pos{color:var(--good)} .big.neg{color:var(--bad)}
.tone-pink .big,.tone-mint .big,.tone-sky .big{color:var(--ink)}
.s2{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:.85rem;color:var(--ink)}
.s2 span{display:flex;justify-content:space-between;gap:6px}
.s2 b{font-weight:800}.s2 b.pos{color:var(--good)}.s2 b.neg{color:var(--bad)}
.tone-pink .s2 b.pos,.tone-pink .s2 b.neg,.tone-mint .s2 b.pos,.tone-mint .s2 b.neg,.tone-sky .s2 b.pos,.tone-sky .s2 b.neg{color:var(--ink)}
.kv{display:flex;flex-direction:column;margin-bottom:8px;font-size:.88rem}.kv span{color:var(--ink2);font-size:.75rem}.kv b{font-weight:700;overflow-wrap:anywhere}
.tone-sky .kv span{color:#1f2a44}
/* תגית גודל מרפאה */
.size{display:inline-block;border:2px solid var(--ink);border-radius:8px;padding:0 8px;font-size:.72rem;font-weight:700;background:var(--yellow);color:var(--ink)}
/* מעקב לידים */
.lead-fu{margin-top:12px;padding:12px;border:2.5px solid var(--ink);border-radius:18px;background:var(--yellow)}
.lead-fu label{color:var(--ink);margin-top:0}
.cond-box{margin-top:12px;padding:12px;border:2.5px solid var(--ink);border-radius:18px}
.cond-box label{color:var(--ink);font-weight:700;margin-top:0}
.cond-mint{background:var(--mint)} .cond-sky{background:var(--sky)}
.lead-table td,.lead-table th{white-space:nowrap}
.field-err{color:var(--bad);font-weight:700;margin-top:10px}
[hidden]{display:none!important}
/* ליד ככרטיס בנייד, ובטבלה במסך רחב */
.lead-cards{display:none;flex-direction:column;gap:10px;margin-top:10px}
.lead-card{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px}
.lead-name{font-weight:700;font-size:1.05rem}
@media (max-width:760px){
  .lead-cards{display:flex}
  .lead-table-wrap{display:none}
}
.lead-table{font-size:.8rem}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div><h1>מערכת הרכזים</h1><div class="sub" id="hdate"></div></div>
  <div class="who" id="who"></div>
</div></header>

<!-- כל מסך מצויר לתוך האלמנט הזה (ראו js/ui/router.js) -->
<main class="wrap" id="app"></main>

<nav class="tabs" aria-label="ניווט ראשי"><div class="in" id="tabs"></div></nav>

<!-- ספריות חיצוניות (גרסאות נעולות): Supabase לחיבור לשרת, SheetJS לייצוא לאקסל -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function () {
'use strict';
/* מנגנון מודולים מינימלי: __defs מחזיק את קוד כל מודול, __req טוען מודול פעם אחת ומחזיר את ה-exports שלו */
const __defs = {};
const __cache = {};
function __req(key) {
  if (__cache[key]) return __cache[key];
  const exports = {};
  __cache[key] = exports;
  __defs[key](exports);
  return exports;
}
/* ===== js/api/auth.js ===== */
__defs['js/api/auth.js'] = function (__exports) {
/**
 * api/auth.js - כניסה, יציאה והחלפת סיסמה.
 * שם המשתמש הוא שם קצר (igal, daniel...); מאחורי הקלעים הוא מומר לכתובת דוא"ל פנימית.
 */
const { sb } = __req('js/api/client.js');
const { MAIL_DOMAIN } = __req('js/config.js');

/** כניסה. מחזיר { userId } או { error } */
async function signIn(username, password) {
  const email = username.trim().toLowerCase() + MAIL_DOMAIN;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error || !data || !data.user) return { error: error || new Error('כניסה נכשלה') };
  return { userId: data.user.id };
}

/** יציאה מהמערכת */
function signOut() {
  return sb.auth.signOut();
}

/** מזהה המשתמש אם קיימת כניסה פעילה (למשל אחרי רענון הדף), אחרת null */
async function currentUserId() {
  const { data } = await sb.auth.getSession();
  return data && data.session ? data.session.user.id : null;
}

/** מאזין ליציאה מהמערכת (גם כשהחיבור פג תוקף) */
function onSignedOut(callback) {
  sb.auth.onAuthStateChange(event => {
    if (event === 'SIGNED_OUT') callback();
  });
}

/** החלפת הסיסמה של המשתמש המחובר */
async function changePassword(newPassword) {
  const { error } = await sb.auth.updateUser({ password: newPassword });
  return { error };
}

__exports.signIn = signIn;
__exports.signOut = signOut;
__exports.currentUserId = currentUserId;
__exports.onSignedOut = onSignedOut;
__exports.changePassword = changePassword;
};

/* ===== js/api/client.js ===== */
__defs['js/api/client.js'] = function (__exports) {
/**
 * api/client.js - יצירת לקוח Supabase יחיד לכל האפליקציה.
 * ספריית Supabase נטענת כסקריפט רגיל ב-index.html ומוגדרת כ-window.supabase.
 */
const { SB_URL, SB_KEY } = __req('js/config.js');

const sb = window.supabase.createClient(SB_URL, SB_KEY);

__exports.sb = sb;
};

/* ===== js/api/clinicsApi.js ===== */
__defs['js/api/clinicsApi.js'] = function (__exports) {
/**
 * api/clinicsApi.js - עדכון נתוני מרפאה.
 * הכתיבה עוברת דרך פונקציית שרת (save_clinic_data) שאוכפת את הכללים:
 * מנהל משנה הכול, ורכז רק משלים ערכים חסרים ביחידות שלו.
 */
const { sb } = __req('js/api/client.js');
const { mapClinic } = __req('js/api/mappers.js');

/** שומר מצטרפים ועוזבים (מערכים של כל הקפיטציות) ויעד, ומחזיר את המרפאה המעודכנת */
async function saveClinicData(clinicId, joiners, leavers, target) {
  const { error } = await sb.rpc('save_clinic_data', { p_id: clinicId, p_j: joiners, p_l: leavers, p_target: target });
  if (error) return { error };
  const { data } = await sb.from('clinics').select('*').eq('id', clinicId);
  return { clinic: data && data[0] ? mapClinic(data[0]) : null };
}

__exports.saveClinicData = saveClinicData;
};

/* ===== js/api/leadsApi.js ===== */
__defs['js/api/leadsApi.js'] = function (__exports) {
/**
 * api/leadsApi.js - כתיבה של לידים לשרת.
 * הערה: בעלות על ליד נקבעת בשרת לפי המשתמש המחובר, ולא ניתנת לשינוי אחרי היצירה.
 */
const { sb } = __req('js/api/client.js');
const { mapLead } = __req('js/api/mappers.js');

const DUPLICATE_ID_CODE = '23505'; // קוד שגיאה של Postgres: ערך כפול בשדה ייחודי

/** מתרגם שגיאת שרת להודעה בעברית */
function leadErrorText(error) {
  if (!error) return '';
  if (error.code === DUPLICATE_ID_CODE) return 'ליד עם ת.ז זו כבר קיים במערכת (אצלך או אצל רכז אחר).';
  return error.message || 'השמירה נכשלה';
}

function toRow(lead) {
  return {
    id_number: lead.idNumber || null,               // ת.ז אינה חובה
    first_name: lead.firstName, last_name: lead.lastName,
    phone: lead.phone, city: lead.city, source: lead.source,
    referrer_name: lead.referrerName || null, event_location: lead.eventLocation || null,
    status: lead.status, followup_at: lead.followupAt,
  };
}

async function insertLead(lead) {
  const { data, error } = await sb.from('leads').insert(toRow(lead)).select();
  return { lead: data && data[0] ? mapLead(data[0]) : null, error };
}

/** מעדכן סטטוס ומועד שיחה נוספת בלבד (שאר השדות קבועים אחרי היצירה) */
async function updateLeadStatus(id, status, followupAt) {
  const { data, error } = await sb.from('leads').update({ status, followup_at: followupAt }).eq('id', id).select();
  return { lead: data && data[0] ? mapLead(data[0]) : null, error };
}

async function deleteLead(id) {
  const { data, error } = await sb.from('leads').delete().eq('id', id).select();
  return { ok: !error && data && data.length > 0, error };
}

__exports.leadErrorText = leadErrorText;
__exports.insertLead = insertLead;
__exports.updateLeadStatus = updateLeadStatus;
__exports.deleteLead = deleteLead;
};

/* ===== js/api/loaders.js ===== */
__defs['js/api/loaders.js'] = function (__exports) {
/**
 * api/loaders.js - טעינת נתונים מהשרת אל ה-store.
 */
const { sb } = __req('js/api/client.js');
const { store } = __req('js/core/state.js');
const { mapProfile, mapClinic, mapVisit, mapLead } = __req('js/api/mappers.js');

const PAGE = 1000; // השרת מחזיר עד 1000 שורות בקריאה

/** קורא את כל השורות של טבלה (בדפים), עם מיון אופציונלי */
async function fetchAll(table, orderBy) {
  let rows = [];
  for (let from = 0; ; from += PAGE) {
    const query = sb.from(table).select('*').range(from, from + PAGE - 1);
    const { data, error } = orderBy ? await query.order(orderBy) : await query;
    if (error) throw error;
    rows = rows.concat(data);
    if (data.length < PAGE) break;
  }
  return rows;
}

async function loadVisits() {
  const rows = await fetchAll('visits', 'vdate');
  store.visits = rows.map(mapVisit).sort((a, b) => b.date.localeCompare(a.date));
}

async function loadLeads() {
  const rows = await fetchAll('leads', 'created_at');
  store.leads = rows.map(mapLead).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
}

/** יומן שינויים (קריאה מותרת למנהל בלבד, לכן למשתמשים אחרים התוצאה ריקה) */
async function loadLog() {
  const { data } = await sb.from('change_log').select('*').order('ts', { ascending: false }).limit(15);
  store.log = (data || []).map(r => ({
    when: new Date(r.ts).toLocaleString('he-IL'), user: r.user_name, what: r.what,
  }));
}

/** טוען הגדרה שנשמרה בטבלת settings אל store.settings */
function applySetting(row) {
  if (row.key === 'checklist') store.settings.checklist = row.value;
  if (row.key === 'lead_sources') store.settings.leadSources = row.value;
  if (row.key === 'size_thresholds') store.settings.sizeThresholds = row.value;
}

/** טעינה מלאה אחרי כניסה */
async function loadAll() {
  const [profiles, clinics, reasons, settings] = await Promise.all([
    fetchAll('profiles'), fetchAll('clinics'), fetchAll('reasons', 'idx'), fetchAll('settings'),
  ]);
  store.users = profiles.map(mapProfile);
  store.clinics = clinics.map(mapClinic);
  store.reasons = [];
  reasons.forEach(r => { store.reasons[r.idx] = r.name; });
  settings.forEach(applySetting);
  await Promise.all([loadVisits(), loadLeads()]);
}

/**
 * core/dom.js - עזרים קטנים לעבודה עם הדף.
 */

/** קיצור ל-querySelector */
const $ = selector => document.querySelector(selector);

/** הודעה קצרה בתחתית המסך שנעלמת מעצמה */
function toast(text) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  el.setAttribute('role', 'status');
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

/** טקסט שגיאה קריא מתוך שגיאה של שרת */
function errorText(error) {
  return error && error.message ? error.message : 'שגיאה לא צפויה';
}

/**
 * מצייר מחדש ומחזיר את הפוקוס (ואת מיקום הסמן) לשדה שהמשתמש הקליד בו.
 * נדרש בחיפוש חי, כי ציור מחדש מוחק את השדה ויוצר אותו מחדש.
 */
function rerenderKeepingFocus(fieldId, rerender) {
  const old = document.getElementById(fieldId);
  const caret = old ? old.selectionStart : 0;
  rerender();
  const fresh = document.getElementById(fieldId);
  if (fresh) {
    fresh.focus();
    fresh.setSelectionRange(caret, caret);
  }
}

/** גולל לראש הדף */
function scrollTop() {
  window.scrollTo(0, 0);
}

__exports.errorText = errorText;
__exports.rerenderKeepingFocus = rerenderKeepingFocus;
__exports.scrollTop = scrollTop;

__defs['js/core/events.js'] = function (__exports) {
/**
 * core/events.js - ניהול אירועים מרוכז ("האזנה אחת לכל הדף").
 *
 * במקום להצמיד מאזין לכל כפתור, כל אלמנט ב-HTML מצהיר מה הוא עושה באמצעות מאפיין data:
 *   data-act="saveVisit"  - פעולה בלחיצה
 *   data-chg="leadStatus" - פעולה בשינוי ערך (select, checkbox, תאריך)
 *   data-inp="searchLeads"- פעולה בכל הקלדה
 *   data-enter="login"    - פעולה בלחיצה על Enter בתוך השדה
 *
 * כל מסך מייצא אובייקט handlers עם פונקציות בשמות האלה, ו-main.js רושם אותן כאן.
 * פונקציית פעולה מקבלת (element, event) ויכולה לקרוא מאפייני data נוספים דרך element.dataset.
 */
const handlers = new Map();

/** רושם פעולות של מסך. שם כפול בין מסכים הוא שגיאה ולכן נזרקת חריגה. */
function registerHandlers(map) {
  Object.keys(map).forEach(name => {
    if (handlers.has(name)) throw new Error(`שם פעולה כפול: ${name}`);
    handlers.set(name, map[name]);
  });
}

function run(name, el, event) {
  const fn = handlers.get(name);
  if (fn) fn(el, event);
}

/** מחבר את מאזיני הדף. נקרא פעם אחת באתחול. */
function initEvents() {
  document.addEventListener('click', event => {
    const el = event.target.closest('[data-act]');
    if (el) run(el.dataset.act, el, event);
  });

  document.addEventListener('change', event => {
    const el = event.target.closest('[data-chg]');
    if (el) run(el.dataset.chg, el, event);
  });

  document.addEventListener('input', event => {
    const el = event.target.closest('[data-inp]');
    if (el) run(el.dataset.inp, el, event);
  });

  document.addEventListener('keydown', event => {
    // Enter או רווח על אלמנט שמתנהג ככפתור (נגישות מקלדת)
    if ((event.key === 'Enter' || event.key === ' ') && event.target.matches && event.target.matches('[role="button"][data-act]')) {
      event.preventDefault();
      event.target.click();
      return;
    }
    // Enter בתוך שדה שמוגדר data-enter
    if (event.key === 'Enter' && event.target.dataset && event.target.dataset.enter) {
      run(event.target.dataset.enter, event.target, event);
    }
  });
}

__exports.registerHandlers = registerHandlers;
__exports.initEvents = initEvents;
};

__defs['js/domain/metrics.js'] = function (__exports) {
/**
 * domain/metrics.js - כל החישובים של המערכת. פונקציות טהורות: מקבלות נתונים ומחזירות מספרים,
 * בלי לצייר דבר. כך קל לבדוק אותן ולשנות כללי חישוב במקום אחד.
 *
 * מושגים:
 *  - יעד: מספר מצטרפים לקפיטציה (נקבע מראש לכל קפיטציות 2026).
 *  - אחוז מהיעד: מצטרפים בפועל חלקי (יעד x מספר הקפיטציות שדווחו).
 *  - מאזן: מצטרפים פחות עוזבים.
 */
const { store } = __req('js/core/state.js');
const { CAPS_2026, CAPS_PER_YEAR, CAP_COUNT, FIRST_CAP_2026, TARGET_ALERT_PCT } = __req('js/config.js');

/** האם נתוני קפיטציה דווחו (גם מצטרפים וגם עוזבים) */
function isReported(clinic, capIndex) {
  return clinic.j[capIndex] !== null && clinic.l[capIndex] !== null;
}

/**
 * סטטיסטיקה של מרפאה אחת ל-2026.
 * @returns {{j,l,bal,n,tg,yt,ya,pct}} n = קפיטציות שדווחו, tg = יעד לקפיטציה,
 *   yt = יעד יחסי (tg x n), ya = יעד שנתי, pct = אחוז מהיעד היחסי (או null אם אין יעד)
 */
function clinicStats(clinic) {
  let joiners = 0, leavers = 0, reported = 0;
  CAPS_2026.forEach(i => {
    if (isReported(clinic, i)) {
      joiners += clinic.j[i];
      leavers += clinic.l[i];
      reported++;
    }
  });

  const relative = perCap ? perCap * reported : null;

    j: joiners, l: leavers, bal: joiners - leavers, n: reported,
    tg: perCap, yt: relative, ya: perCap ? perCap * CAPS_PER_YEAR : null,
    pct: relative ? (joiners / relative) * 100 : null,
  };

function aggregate(clinics) {

  clinics.forEach(c => {
    const s = clinicStats(c);
    J += s.j;
    L += s.l;
    if (s.n > maxReported) maxReported = s.n;
    if (s.n) reportingClinics++;
    if (s.yt) { withTargetJ += s.j; relTarget += s.yt; annualTarget += s.ya; }
  });
  return {
    J, L, bal: J - L,
    jt: withTargetJ, tt: relTarget, ta: annualTarget,
    nmax: maxReported, reporting: reportingClinics,
    targetPct: relTarget ? (withTargetJ / relTarget) * 100 : null,
  };
}

/**
 * סיכום לפי קפיטציה לקבוצת מרפאות: מצטרפים, עוזבים, מאזן ויעד (רק 2026).
 * איבר null = אף יחידה לא דיווחה על הקפיטציה.
 */

    clinics.forEach(c => {
      if (!isReported(c, i)) return;
      j += c.j[i];
      l += c.l[i];
      any = true;
      if (c.target > 0 && i >= FIRST_CAP_2026) targetOfReporters += c.target;

    series.push(any ? { j, l, bal: j - l, tt: targetOfReporters } : null);
  }

function lastReportedCap(series) {

  return -1;
}

/** סכום סיבות עזיבה לפי סיבה, בטווח קפיטציות. מחזיר { אינדקס סיבה: סכום } */
function reasonTotals(clinics, capIndexes) {
  const totals = {};

    Object.keys(c.rs).forEach(reason => {
      const perCap = c.rs[reason];
      const sum = capIndexes.reduce((s, i) => s + (perCap[i] || 0), 0);
      if (sum) totals[reason] = (totals[reason] || 0) + sum;
    });
  });

}

/** כל המשימות הפתוחות בביקורים של קבוצת מרפאות */
function openTasks(clinics) {

  const result = [];
  store.visits.forEach(visit => {
    if (!ids.has(visit.clinicId)) return;
    visit.tasks.forEach((task, index) => {
      if (!task.done) result.push({ visit, task, index });
    });
  });
  return result;
}

/** תאריך הביקור האחרון במרפאה, או null */
function lastVisitDate(clinicId) {
  let last = null;
  store.visits.forEach(v => {
    if (v.clinicId === clinicId && (!last || v.date > last)) last = v.date;
  });
  return last;
}

/** האם יעד המשימה עבר (ולא בוצעה) */
function isOverdue(task, today) {
  return !task.done && task.due && task.due < today;
}

// ---------- גודל מרפאה ----------

/** גודל לפי מספר מבוטחים: 'large' | 'medium' | 'small', או null למאגרים, בתי חולים ויחידות ללא נתון */
function sizeOf(clinic) {
  if (clinic.pool || clinic.hospital || clinic.ins === null || clinic.ins === undefined) return null;
  const { medium, large } = store.settings.sizeThresholds;
  if (clinic.ins >= large) return 'large';
  if (clinic.ins >= medium) return 'medium';
  return 'small';
}

const SIZE_LABELS = { large: 'גדולה', medium: 'בינונית', small: 'קטנה' };

// ---------- מרפאות בפיגור ----------

/**
 * מרפאות שמתחת לאחוז היעד, מהנמוכה לגבוהה.
 * @param {boolean} includeSmall האם לכלול גם מרפאות קטנות (ברירת מחדל: רק בינוניות וגדולות)
 * @returns {{clinic, stats, size}[]}

    .filter(c => !c.pool && !c.hospital)

    .sort((a, b) => a.stats.pct - b.stats.pct);

  if (pct === null || pct === undefined) return 'na';
  if (pct >= 100) return 'good';
  if (pct >= TARGET_ALERT_PCT) return 'warn';
  return 'bad';
}

/** צבע תגית לפי אחוז השלמה (צ'ק ליסט) */
function completionTone(pct) {
  return pct >= 85 ? 'good' : pct >= 60 ? 'warn' : 'bad';
}

__exports.isReported = isReported;
__exports.clinicStats = clinicStats;
__exports.aggregate = aggregate;
__exports.capSeries = capSeries;
__exports.lastReportedCap = lastReportedCap;
__exports.reasonTotals = reasonTotals;
__exports.openTasks = openTasks;
__exports.lastVisitDate = lastVisitDate;
__exports.isOverdue = isOverdue;
__exports.sizeOf = sizeOf;
__exports.belowTargetClinics = belowTargetClinics;
__exports.targetTone = targetTone;
__exports.completionTone = completionTone;
__exports.SIZE_LABELS = SIZE_LABELS;

 */

  const allItems = [];

  return visits.map(v => {
    const clinic = clinicOf(v);
    const items = visitChecklist(v);
    const done = v.checks.filter(Boolean).length;
    const row = {
      'תאריך': v.date, 'שעה': v.time || '', 'מינהלת': MG_NAMES[clinic.mg] || '',
      'מרפאה': clinic.name || '', 'ישוב': clinic.town || '', 'מתעד/ת': userName(v.coordId),
      'מטרת הביקור': v.purpose || '', 'משתתפים': v.people || '',
      'השלמת צ׳ק ליסט': items.length ? Math.round(done / items.length * 100) + '%' : '',

    row['סיכום'] = v.summary || '';
    row['משימות פתוחות'] = v.tasks.filter(t => !t.done).length;

    'משימה': t.text, 'אחראי': t.owner || '', 'תאריך יעד': t.due || '',
    'בוצע': t.done ? 'כן' : 'לא', 'באיחור': (!t.done && t.due && t.due < today) ? 'כן' : '',

/**
 * exports/workbook.js - יצירת קובץ אקסל להורדה.
 * ספריית SheetJS נטענת כסקריפט רגיל ב-index.html ומוגדרת כ-XLSX.
 */
const { toast } = __req('js/core/dom.js');

/** האם הספרייה נטענה (אם הרשת חסמה אותה, מציגים הודעה) */
function excelAvailable() {
  if (typeof XLSX === 'undefined') {
    toast('רכיב הייצוא לא נטען. נסו לרענן את הדף');
    return false;
  }
  return true;
}

/**
 * מוריד קובץ אקסל בכיוון מימין לשמאל.
 * @param {string} filename שם הקובץ
 * @param {{name:string, rows:object[], widths?:number[]}[]} sheets לשונית לכל איבר; rows = מערך אובייקטים (כותרת = שם המפתח)
 */
function downloadWorkbook(filename, sheets) {
  const wb = XLSX.utils.book_new();
  sheets.forEach(sheet => {
    const ws = XLSX.utils.json_to_sheet(sheet.rows);
    if (sheet.widths) ws['!cols'] = sheet.widths.map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws, sheet.name);
  });
  wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.writeFile(wb, filename);
}

function registerAllHandlers() {
  [

__defs['js/ui/components/capTable.js'] = function (__exports) {
/**
 * ui/components/capTable.js - טבלת "מאזן לפי קפיטציה" (2026 בלבד):
 * יעד מצטרפים, מצטרפים בפועל, עוזבים ומאזן. משמשת במסך הבית ובדף מרפאה.
 */
const { CAPS, CAPS_2026 } = __req('js/config.js');
const { esc, sign, signClass, fmtInt } = __req('js/utils/format.js');

const HEADER = `<thead><tr><th>קפיטציה</th><th>יעד מצטרפים</th><th>מצטרפים בפועל</th><th>עוזבים</th><th>מאזן</th></tr></thead>`;

/** שורה בטבלה. values: { target, j, l } כאשר null/undefined = לא דווח */
function row(label, target, j, l, boldTotal = false) {
  const cell = boldTotal ? 'th' : 'td';
  const reported = j !== null && l !== null && j !== undefined && l !== undefined;
  const balance = reported ? j - l : null;
  return `<tr>
    <${cell}>${esc(label)}</${cell}>
    <${cell}>${target ? fmtInt(target) : '—'}</${cell}>
    <${cell}>${reported ? fmtInt(j) : '—'}</${cell}>
    <${cell}>${reported ? fmtInt(l) : '—'}</${cell}>
    <${cell}>${reported ? `<span class="bal-chip ${signClass(balance)}">${sign(balance)}</span>` : '—'}</${cell}>
  </tr>`;
}

/**
 * טבלה לקבוצת מרפאות.
 * @param series  תוצאת capSeries
 * @param futureTarget יעד כולל לקפיטציה שעוד לא דווחה (מוצג בשורה ריקה)
 * @param total   { target, j, l } לשורת סיכום, או null
 */
function capTable(series, futureTarget, total) {
  const rows = CAPS_2026.map(i => {
    const s = series[i];
    return row(CAPS[i], s ? s.tt : futureTarget, s ? s.j : null, s ? s.l : null);
  }).join('');
  const totalRow = total ? row('סה״כ 2026', Math.round(total.target), total.j, total.l, true) : '';
  return `<div class="scroll"><table>${HEADER}<tbody>${rows}${totalRow}</tbody></table></div>
    <div class="muted" style="margin-top:6px">היעד כולל רק יחידות שהוגדר להן יעד. שורת הסיכום כוללת קפיטציות שדווחו בלבד.</div>`;
}

/** טבלה למרפאה אחת: היעד הוא של המרפאה עצמה */
function clinicCapTable(clinic, stats) {
  const rows = CAPS_2026.map(i => {
    const j = clinic.j[i];
    const l = clinic.l[i];
    return row(CAPS[i], clinic.target > 0 ? clinic.target : null, j, l);
  }).join('');
  const total = stats.n ? row('סה״כ 2026', stats.yt ? Math.round(stats.yt) : null, stats.j, stats.l, true) : '';
  return `<div class="scroll"><table>${HEADER}<tbody>${rows}${total}</tbody></table></div>`;
}

__exports.capTable = capTable;
__exports.clinicCapTable = clinicCapTable;
};

/**
 * בודק את הטיוטה ומחזיר ליד מוכן לשמירה, או הודעת שגיאה.
 * @returns {{lead?:object, error?:string}}
 */
function validateDraft(draft) {
  // ת.ז אינה חובה. אם הוזנה, היא חייבת להיות תקינה
  const rawId = draft.idNumber.trim();
  const idNumber = rawId ? normalizeIsraeliId(rawId) : null;
  if (rawId && !idNumber) return { error: 'מספר תעודת הזהות אינו תקין.' };
  if (!draft.firstName.trim() || !draft.lastName.trim()) return { error: 'יש להזין שם פרטי ושם משפחה.' };
  const phone = normalizePhone(draft.phone);
  if (!phone) return { error: 'מספר הטלפון אינו תקין (למשל 0501234567).' };
  if (!draft.city.trim()) return { error: 'יש להזין עיר מגורים.' };
  if (!draft.source) return { error: 'יש לבחור מקור ליד.' };
  if (needsReferrer(draft.source) && !draft.referrer.trim()) return { error: 'יש להזין את שם העובד הממליץ.' };
  if (needsEventLocation(draft.source) && !draft.eventLocation.trim()) return { error: 'יש להזין את מיקום האירוע.' };
  let followupAt = null;
  if (draft.status === LEAD_STATUS_FOLLOWUP) {
    if (!draft.followup) return { error: 'בסטטוס "המשך טיפול" יש לבחור תאריך ושעה לשיחה נוספת.' };
    followupAt = new Date(draft.followup).toISOString();
  }
  return {
    lead: {
      idNumber, firstName: draft.firstName.trim(), lastName: draft.lastName.trim(), phone,
      city: draft.city.trim(), source: draft.source,
      referrerName: needsReferrer(draft.source) ? draft.referrer.trim() : null,
      eventLocation: needsEventLocation(draft.source) ? draft.eventLocation.trim() : null,
      status: draft.status, followupAt,
    },
  };
}

/**
 * ui/screens/leads.js - מסך "מעקב לידים": טופס הוספה (leadForm.js) וטבלת מעקב (leadTable.js).

const { exportLeads } = __req('js/exports/leadsExcel.js');
const { backButton } = __req('js/ui/components/card.js');
const { leadFormHtml, validateDraft, needsReferrer, needsEventLocation } = __req('js/ui/screens/leadForm.js');
const { leadTableHtml } = __req('js/ui/screens/leadTable.js');

function render() {
  // כפתור חזרה רק אם הגענו לכאן ממסך אחר (למשל "הוספת ליד" מהבית)
  const back = ui.history.length ? backButton('goBack', 'חזרה', 'home') : '';
  return `${back}<h2 style="margin-top:4px">מעקב לידים</h2>${leadFormHtml()}${leadTableHtml()}`;
}

/** מראה או מסתיר אזור בטופס, בלי לצייר את המסך מחדש (כדי לא למחוק מה שהוקלד) */
function setVisible(wrapId, visible) {
  const wrap = document.getElementById(wrapId);
  if (wrap) wrap.hidden = !visible;
}

/** מראה או מסתיר את אזור "מועד לשיחה נוספת" לפי הסטטוס */
function toggleFollowupField(wrapId, status) {
  const wrap = document.getElementById(wrapId);
  if (wrap) wrap.hidden = status !== LEAD_STATUS_FOLLOWUP;
}

// ---------- הוספת ליד ----------

async function saveLead() {
  if (ui.busy) return;
  const state = ui.leads;
  const { lead, error } = validateDraft(state.draft);
  if (error) { state.error = error; requestRender(); return; }
  ui.busy = true;
  const result = await insertLead(lead);
  ui.busy = false;
  if (result.error || !result.lead) {
    state.error = leadErrorText(result.error);
    requestRender();
    return;
  }
  store.leads.unshift(result.lead);
  logChange('הוספת ליד');            // בכוונה בלי פרטים אישיים
  state.draft = emptyLeadsUi().draft;
  state.error = '';
  toast('הליד נשמר');
  requestRender();
}

// ---------- עדכון ליד קיים ----------

async function saveLeadEdit(el) {
  if (ui.busy) return;
  const state = ui.leads;
  const lead = store.leads.find(l => l.id === el.dataset.id);
  if (!lead) return;
  const { status, followup } = state.editDraft;
  if (status === LEAD_STATUS_FOLLOWUP && !followup) {
    state.editError = 'בסטטוס "המשך טיפול" יש לבחור תאריך ושעה לשיחה נוספת.';
    requestRender();
    return;
  }
  const followupAt = status === LEAD_STATUS_FOLLOWUP ? new Date(followup).toISOString() : null;
  ui.busy = true;
  const result = await updateLeadStatus(lead.id, status, followupAt);
  ui.busy = false;
  if (result.error || !result.lead) { state.editError = leadErrorText(result.error) || 'אין הרשאה לעדכן'; requestRender(); return; }
  Object.assign(lead, result.lead);
  logChange('עדכון סטטוס ליד');
  state.editId = null; state.editError = '';
  toast('הליד עודכן');
  requestRender();
}

  ui.busy = true;
  const { ok, error } = await deleteLead(el.dataset.id);
  ui.busy = false;
  if (!ok) { toast(leadErrorText(error) || 'אין הרשאה למחוק'); return; }
  store.leads = store.leads.filter(l => l.id !== el.dataset.id);
  logChange('מחיקת ליד');
  ui.leads.editId = null; ui.leads.confirmDelete = null;
  toast('הליד נמחק');
  requestRender();
}

const handlers = {
  /** עדכון טיוטת הטופס בכל הקלדה או בחירה */
  leadDraft(el) { ui.leads.draft[el.dataset.key] = el.value; },
  /** שינוי סטטוס בטופס: מעדכן את הטיוטה ומציג/מסתיר את שדה מועד השיחה */
  leadDraftStatus(el) {
    ui.leads.draft.status = el.value;
    toggleFollowupField('ld_followup_wrap', el.value);
  },
  /** בחירת מקור: פותח שדה "שם העובד הממליץ" או "מיקום האירוע" לפי המקור */
  leadDraftSource(el) {
    ui.leads.draft.source = el.value;
    setVisible('ld_referrer_wrap', needsReferrer(el.value));
    setVisible('ld_event_wrap', needsEventLocation(el.value));
  },
  saveLead,
  // טבלה
  leadStatusFilter(el) { ui.leads.statusFilter = el.dataset.value; requestRender(); },
  leadCoordFilter(el) { ui.leads.coordFilter = el.value; requestRender(); },
  leadSearch(el) { ui.leads.search = el.value; rerenderKeepingFocus('ld_search', requestRender); },
  exportLeads() { exportLeads(ui.leads.shown); },
  // פאנל עדכון
  editLead(el) {
    const lead = store.leads.find(l => l.id === el.dataset.id);
    if (!lead) return;
    ui.leads.editId = lead.id;
    ui.leads.editDraft = { status: lead.status, followup: toLocalInput(lead.followupAt) };
    ui.leads.editError = '';
    ui.leads.confirmDelete = null;
    requestRender();

    const panel = document.getElementById('lead_edit_panel');
    if (panel && panel.scrollIntoView) panel.scrollIntoView({ block: 'center' });
  },

    toggleFollowupField('le_followup_wrap', el.value);
  },

  deleteLead(el) { ui.leads.confirmDelete = el.dataset.id; requestRender(); },
  deleteLeadNo() { ui.leads.confirmDelete = null; requestRender(); },
  deleteLeadYes,
};


__exports.render = render;

};

  if (f.clinic) list = list.filter(v => v.clinicId === f.clinic);

function staleCard(stale) {

    .map(c => `<span class="chip" data-act="openClinic" data-id="${esc(c.id)}" role="button" tabindex="0">${esc(c.name)}</span>`).join('');
  const more = stale.length > 10 ? `<span class="muted">ועוד ${stale.length - 10}</span>` : '';

/** היסטוריית ביקורים עם סינונים וייצוא (ייצוא למנהל ולנופר בלבד) */

  const exportButton = isManagerView()
    ? `<button class="btn small" data-act="exportVisits">ייצוא לאקסל (${visits.length})</button>` : '';

    ? `<div><label for="f_coord">מתעד/ת</label><select id="f_coord" data-chg="visitFilter" data-key="coord">
         <option value="">הכול</option>${options(who, f.coord, userName)}</select></div>` : '';
  const periods = [['', 'כל הזמן'], ['7', 'שבוע אחרון'], ['30', '30 ימים'], ['90', '90 ימים']];

    <div class="row between"><h3 style="margin:0">היסטוריית ביקורים</h3>${exportButton}</div>
    <div class="grid2">
      <div><label for="f_clinic">מרפאה</label><select id="f_clinic" data-chg="visitFilter" data-key="clinic">
        <option value="">הכול</option>${options(sorted.map(c => c.id), f.clinic, id => sorted.find(c => c.id === id).name)}</select></div>
      ${coordFilter}
      <div><label for="f_period">תקופה</label><select id="f_period" data-chg="visitFilter" data-key="period">
        ${periods.map(([v, t]) => `<option value="${v}"${f.period === v ? ' selected' : ''}>${t}</option>`).join('')}</select></div>
      <div><label for="f_status">סטטוס משימות</label><select id="f_status" data-chg="visitFilter" data-key="status">
        <option value="">הכול</option><option value="open"${f.status === 'open' ? ' selected' : ''}>עם משימות פתוחות</option></select></div>
    </div>
    ${visits.length
      ? `<div class="list" style="margin-top:8px">${visits.map(visitItem).join('')}</div>`
      : emptyNote(store.visits.length ? 'אין ביקורים שמתאימים לסינון.' : 'עדיין לא תועדו ביקורים.')}`);

function render() {
  // טופס ביקור או צפייה בביקור (כל אחד מחזיר טקסט ריק אם הנתונים כבר לא זמינים)
  if (ui.visitClinic) { const html = visitForm.render(); if (html) return html; }
  if (ui.showVisit) { const html = visitDetail.render(); if (html) return html; }

const handlers = {
  visitFilter(el) { ui.visitFilters[el.dataset.key] = el.value; requestRender(); },
  /** פתיחת טופס ביקור ממרפאה מסוימת (מדף מרפאה) */
  newVisit(el) {
    const clinic = getClinic(el.dataset.id);
    if (canVisit() && clinic && !clinic.pool) navigate('visits', { visitClinic: clinic.id });

  /** פתיחת טופס ביקור מהמרפאה שנבחרה ברשימה */
  newVisitPick() {

  exportVisits() { if (isManagerView()) exportVisits(ui.visitsShown); },

__defs['js/utils/clipboard.js'] = function (__exports) {
/**
 * utils/clipboard.js - העתקת טקסט ללוח.
 */
const { toast } = __req('js/core/dom.js');

/** העתקה בדרך המודרנית, ואם הדפדפן לא תומך, בדרך הישנה דרך שדה זמני */
function copyText(text) {
  const done = () => toast('הועתק');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => legacyCopy(text, done));
  } else {
    legacyCopy(text, done);
  }
}

function legacyCopy(text, done) {
  const field = document.createElement('textarea');
  field.value = text;
  document.body.appendChild(field);
  field.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('ההעתקה לא נתמכת בדפדפן'); }
  field.remove();
}

__exports.copyText = copyText;
};

/* ===== js/utils/format.js ===== */
__defs['js/utils/format.js'] = function (__exports) {
/**
 * utils/format.js - פונקציות עזר טהורות לעיצוב טקסט ותאריכים.
 * אין כאן תלות במצב האפליקציה או ב-DOM.
 */

/** מנקה טקסט לפני הכנסה ל-HTML (הגנה מפני הזרקת קוד). חובה לכל טקסט שמגיע ממשתמש או מבסיס הנתונים. */
function esc(value) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(value == null ? '' : value).replace(/[&<>"']/g, ch => map[ch]);
}

const pad2 = n => String(n).padStart(2, '0');

/** תאריך כ-YYYY-MM-DD לפי השעון המקומי */
function isoDate(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

/** התאריך של היום (מחושב בכל קריאה, כדי שלא יתיישן אם הדף נשאר פתוח עד למחרת) */
function todayIso() {
  return isoDate(new Date());
}

/** תאריך יחסי להיום: addDays(-20) הוא לפני 20 יום */
function addDays(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return isoDate(d);
}

/** YYYY-MM-DD ל-DD/MM/YYYY */
function fmtDate(s) {
  if (!s) return '—';
  const [y, m, d] = s.split('-');
  return `${d}/${m}/${y}`;
}

/** תאריך ושעה מלאים (ISO) להצגה: 20/10/2026 14:30 */
function fmtDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

/**
 * כמה ימים עברו מתאריך מסוים עד היום (תאריך היום פחות התאריך, לפי ימי לוח ולא לפי שעות).
 * ליד שנפתח היום = 0, אתמול = 1.
 */
function daysSince(iso) {
  if (!iso) return null;
  const start = new Date(iso);
  const from = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const now = new Date();
  const to = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((to - from) / 86400000);
}

/** ערך לשדה datetime-local (YYYY-MM-DDTHH:MM) מתוך תאריך ISO */
function toLocalInput(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${isoDate(d)}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

/** מספר עם מפריד אלפים: 6595 -> "6,595" */
function fmtInt(n) {
  return Number(n).toLocaleString('he-IL');
}

/** מספר עם סימן ומפריד אלפים: 5 -> "+5", -1833 -> "-1,833", 0 -> "0" */
function sign(n) {
  return (n > 0 ? '+' : '') + fmtInt(n);
}

/** האם הערך הוא מספר או ביטוי מספרי (כמו "-1,833", "72%", "0 / 160") שצריך להיות מוצג משמאל לימין */
function isNumeric(value) {
  return typeof value === 'number' || /^[+\-−\d.,%\s/]+$/.test(String(value));
}

/** ערך להצגה: מספרים מקבלים מפריד אלפים, וטקסט נשאר כמו שהוא */
function fmtValue(value) {
  return typeof value === 'number' ? fmtInt(value) : value;
}

/** CSS class לפי סימן המספר: ירוק לחיובי, אדום לשלילי */
function signClass(n) {
  return n > 0 ? 'pos' : n < 0 ? 'neg' : '';
}

/** ממיר ערך משדה טופס למספר שלם, או null אם ריק או לא תקין */
function toInt(value) {
  if (value === null || value === undefined || value === '' || isNaN(Number(value))) return null;
  return Math.round(Number(value));
}

/** אחוז להצגה: 71.4 -> "71%". עבור null מחזיר את הטקסט החלופי */
function pctLabel(p, fallback = 'לא דווח') {
  return p === null || p === undefined ? fallback : `${Math.round(p)}%`;
}

/** מסתיר את רוב ספרות ת.ז: 123456782 -> "•••••6782" */
function maskId(id) {
  return id ? `•••••${String(id).slice(-4)}` : '—';
}

/** פונקציית מיון לפי סדר האלף-בית העברי: list.sort(localeSort) */
function localeSort(a, b) {
  return a.localeCompare(b, 'he');
}

__exports.isoDate = isoDate;

__exports.daysSince = daysSince;
__exports.toLocalInput = toLocalInput;
__exports.fmtInt = fmtInt;
__exports.sign = sign;
__exports.isNumeric = isNumeric;

__exports.signClass = signClass;
__exports.toInt = toInt;
__exports.pctLabel = pctLabel;
__exports.maskId = maskId;

};

/**
 * utils/validate.js - בדיקות תקינות לשדות בטפסים.
 * כל הפונקציות טהורות ומחזירות ערך חזרה, בלי לגעת במסך.

/**
 * בודק תעודת זהות ישראלית: עד 9 ספרות (משלים אפסים משמאל) ובדיקת ספרת ביקורת.
 * @returns {string|null} ת.ז בת 9 ספרות אם תקינה, אחרת null
 */
function normalizeIsraeliId(input) {
  const digits = String(input || '').replace(/\D/g, '');
  if (digits.length < 5 || digits.length > 9) return null;
  const id = digits.padStart(9, '0');
  let sum = 0;
  for (let i = 0; i < 9; i++) {
    let step = Number(id[i]) * (i % 2 === 0 ? 1 : 2);
    if (step > 9) step -= 9;
    sum += step;
  }
  return sum % 10 === 0 ? id : null;
}

/**
 * מנרמל מספר טלפון ישראלי לצורה 0501234567 (ללא מקפים ורווחים, וקידומת 972+ מומרת ל-0).
 * @returns {string|null} המספר התקני, או null אם אינו תקין
 */
function normalizePhone(input) {
  let digits = String(input || '').replace(/[^\d+]/g, '');
  if (digits.startsWith('+972')) digits = '0' + digits.slice(4);
  else if (digits.startsWith('972')) digits = '0' + digits.slice(3);
  return /^0\d{8,9}$/.test(digits) ? digits : null;
}
